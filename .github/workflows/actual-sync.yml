name: Actual Budget sync

# Pushes unsynced Payment rows from Strapi into Actual Budget (automation/actual-sync).
#
# Until 2026-10-24 this ran as the second job of agendapro-pull.yml, right after the
# AgendaPro scrape. AgendaPro is gone: payments now arrive whenever the studio closes the
# day in the admin panel (POST /ingest/payments), so the sync runs on its own clock.
#
# Two runs a day: one after closing time, one early morning to catch a late "Cierre del
# día". Both are idempotent (Actual dedups on imported_id, Strapi flags synced rows), so a
# GitHub delay or a double run costs nothing.
on:
  schedule:
    # 02:30 UTC = 21:30 Bogota; 11:30 UTC = 06:30 Bogota. Off the :00 slot on purpose
    # (see agendapro-pull.yml history: top-of-hour runs slipped hours late).
    - cron: '30 2 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = print what would be written, touch nothing."
        required: false
        default: "false"

concurrency:
  group: actual-sync
  cancel-in-progress: false

jobs:
  actual-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/actual-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync income to Actual Budget
        run: node sync.mjs
        env:
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_INCOMES_URL: ${{ vars.INGEST_INCOMES_URL }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
          ACTUAL_SERVER_URL: ${{ secrets.ACTUAL_SERVER_URL }}
          ACTUAL_PASSWORD: ${{ secrets.ACTUAL_PASSWORD }}
          ACTUAL_SYNC_ID: ${{ secrets.ACTUAL_SYNC_ID }}
          ACTUAL_ACCT_BANCOLOMBIA: ${{ vars.ACTUAL_ACCT_BANCOLOMBIA }}
          ACTUAL_ACCT_EFECTIVO: ${{ vars.ACTUAL_ACCT_EFECTIVO }}
          ACTUAL_ACCT_DEFAULT: ${{ vars.ACTUAL_ACCT_DEFAULT }}
          ACTUAL_CATEGORY_SERVICIOS: ${{ vars.ACTUAL_CATEGORY_SERVICIOS }}
          ACTUAL_SYNC_SINCE: ${{ vars.ACTUAL_SYNC_SINCE }}
          ACTUAL_PANEL_PAYEE: ${{ vars.ACTUAL_PANEL_PAYEE }}
          COURTESY_PHONES: ${{ vars.COURTESY_PHONES }}
          UNNAMED_GRACE_DAYS: ${{ vars.UNNAMED_GRACE_DAYS }}
