# Construye la imagen del CMS, la publica en GHCR y escribe su digest en
# `deploy/compose/.env`. Portainer (stack `strapi-cms` en modo Git) hace polling
# del repo y redespliega solo. CI no tiene ninguna credencial hacia la VM: su
# único secreto es el `GITHUB_TOKEN`. Es el mismo diseño del panel
# (golden-beauty-studio-landing, `admin-image.yml`): los webhooks de stack son
# Business Edition en Portainer.
#
# Dos guardas anti-bucle, porque el último paso commitea al repo:
#   1. `paths-ignore` — un push que solo toca `deploy/**` no construye.
#   2. `[skip ci]` en el mensaje del commit de despliegue.

name: Build and Push Strapi Image

on:
  push:
    branches:
      - master
    paths-ignore:
      - "deploy/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mega61/golden-beauty-studio-crm

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            STRAPI_ADMIN_BACKEND_URL=https://cms.goldenbeautystudio.com.co

      # Por digest y no por `:latest`: `git revert` de este commit devuelve
      # exactamente la imagen anterior. Portainer lo toma en su próximo polling.
      - name: Escribir el digest en deploy/compose/.env
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          # Solo la línea del digest: el resto del archivo explica por qué existe.
          sed -i -E "s#^STRAPI_IMAGE=.*#STRAPI_IMAGE=${IMAGE}@${DIGEST}#" deploy/compose/.env
          grep -q "^STRAPI_IMAGE=${IMAGE}@sha256:" deploy/compose/.env

          if git diff --quiet -- deploy/compose/.env; then
            echo "El digest no cambió. No hay nada que desplegar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/compose/.env
          git commit -m "[skip ci] deploy: cms ${GITHUB_SHA::7}"
          git pull --rebase --autostash origin master
          git push origin HEAD:master
