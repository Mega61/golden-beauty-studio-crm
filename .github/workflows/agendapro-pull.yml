name: AgendaPro daily pull

on:
  # No schedule since 2026-10-24: AgendaPro was cancelled and the admin panel is now the
  # source of payments (POST /ingest/payments) and visits (POST /ingest/panel-visits).
  # Kept as a manual run for the encrypted cutover export. The Actual Budget sync that
  # used to ride along as a second job lives in actual-sync.yml on its own schedule.
  workflow_dispatch: # manual trigger for testing
    inputs:
      finance_window_days:
        description: >-
          Days back for the transactions/sales reports. Leave empty for the usual window;
          set it wide (e.g. 95) once to label every sale since ACTUAL_SYNC_SINCE.
        required: false

concurrency:
  group: agendapro-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/agendapro-pull
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Persist the AgendaPro session (cookies) between runs so the browser/2FA
      # only fires when the session has expired. Unique key per run + prefix restore
      # = always save, always restore the most recent.
      - name: Restore session
        uses: actions/cache@v4
        with:
          path: automation/agendapro-pull/.session
          key: agendapro-session-${{ github.run_id }}
          restore-keys: agendapro-session-

      - name: Pull report and upload to Strapi
        run: node pull.mjs
        env:
          AGENDAPRO_EMAIL: ${{ secrets.AGENDAPRO_EMAIL }}
          AGENDAPRO_PASSWORD: ${{ secrets.AGENDAPRO_PASSWORD }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GMAIL_IMPERSONATE: ${{ secrets.GMAIL_IMPERSONATE }}
          OTP_SENDER: ${{ vars.OTP_SENDER }}
          INGEST_URL: ${{ vars.INGEST_URL }}
          INGEST_TRANSACTIONS_URL: ${{ vars.INGEST_TRANSACTIONS_URL }}
          INGEST_SALES_URL: ${{ vars.INGEST_SALES_URL }}
          INGEST_SHARED_SECRET: ${{ secrets.INGEST_SHARED_SECRET }}
          WINDOW_DAYS: ${{ vars.WINDOW_DAYS }}
          WINDOW_FORWARD_DAYS: ${{ vars.WINDOW_FORWARD_DAYS }}
          FINANCE_WINDOW_DAYS: ${{ inputs.finance_window_days || vars.FINANCE_WINDOW_DAYS }}
          SESSION_FILE: .session/agendapro.json

      # Diagnostics: on failure, the job writes a screenshot + url + cookie-name dump
      # to debug/. Download it from the run's Artifacts to see what the headless run hit.
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agendapro-debug
          path: automation/agendapro-pull/debug/
          if-no-files-found: ignore
          retention-days: 7
